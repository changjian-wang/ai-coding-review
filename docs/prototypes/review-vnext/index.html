<!doctype html>
<html lang="zh-CN" data-theme="dark" data-prototype="review-center">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta name="description" content="AI Coding Review 独立桌面应用交互原型：主页连接 GitHub 或本地仓库，代码区选择分支/PR，定位问题并按需核对需求、证据与修复。仅使用离线演示数据。">
  <title>AI Coding Review · 桌面原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23182226'/%3E%3Cpath d='m8 16 5 5 11-12' fill='none' stroke='%2376d6b7' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./center.css">
  <script defer src="./app.js"></script>
  <script defer src="./sources.js"></script>
  <script defer src="./feedback.js"></script>
  <script defer src="./markdown.bundle.js"></script>
  <script defer src="./center.js"></script>
</head>
<body>
  <a class="skip-link" href="#review-main">跳到主要内容</a>
  <div class="review-shell single-page code-linked desktop-app">
    <header class="command-bar">
      <div class="product-lockup"><span id="product-mark" class="product-mark"></span><div><strong>AI Coding Review</strong><span id="repository-context">桌面原型</span></div></div>
      <div class="command-actions">
        <button class="icon-button" data-action="help" aria-label="原型说明" title="原型说明"></button>
        <button id="center-theme" class="icon-button" data-action="theme" aria-label="切换为浅色主题" title="切换主题"></button>
      </div>
    </header>
    <div class="center-workspace">
      <main id="review-main" tabindex="-1"></main>
    </div>
    <footer class="demo-bar">
      <div class="demo-identity"><span class="prototype-indicator"></span><span>离线演示 · 未连接真实仓库与模型</span></div>
      <span id="workspace-status" role="status" aria-live="polite">选择代码仓库</span>
      <div class="demo-controls">
        <details id="demo-tools" class="demo-tools">
          <summary>演示工具</summary>
          <div class="demo-tool-panel">
            <label class="field-label" for="demo-scenario">演示场景（非实际审查状态）</label>
            <p class="form-hint">先选择 Repo 和分支 / PR。切换场景会重置当前 Repo 的演示上下文。</p>
            <select id="demo-scenario" aria-label="选择独立演示场景">
              <option value="fresh" selected>未开始 · 选择审查对象</option>
              <option value="standard">有问题 · 等待核对</option>
              <option value="technical">整仓 Bug 审查 · 无需求</option>
              <option value="partial">部分完成 · 证据受限</option>
              <option value="ready">无待处理问题 · 独立示例</option>
            </select>
            <div class="demo-tool-actions">
              <button class="button small" data-action="use-example-materials">载入示例需求</button>
              <button class="button small" data-action="materials">选择可用材料</button>
              <button class="button small" data-action="demo-paste">体验粘贴示例</button>
              <button class="button small" data-action="demo-link">体验链接示例</button>
              <button id="demo-requirement" class="button small" data-action="demo-requirement">澄清超时需求示例</button>
            </div>
            <label class="field-label" for="demo-source">来源快照</label>
            <select id="demo-source" aria-label="选择演示来源快照"></select>
            <button id="demo-update-source" class="button small" data-action="demo-update-source">更新所选来源快照</button>
            <div class="demo-tool-actions">
              <button id="center-code-change" class="button small" data-action="simulate-code-change" title="仅切换演示快照，不创建真实提交">模拟新提交</button>
              <button id="center-reset" class="button small" data-action="reset">重置当前演示</button>
              <button class="button small" data-action="workspace-storage">工作区保存与隐私</button>
            </div>
          </div>
        </details>
      </div>
    </footer>
  </div>
  <div id="repository-menu" class="repository-menu" role="menu" aria-label="仓库操作" tabindex="-1" hidden></div>
  <dialog id="center-modal" class="single-page" aria-labelledby="center-modal-title"></dialog>
  <input type="file" id="requirement-file" accept=".md,.markdown,.txt,text/markdown,text/plain" hidden>
  <div id="center-toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript">交互原型需要启用 JavaScript。脚本、样式与演示均在本地；文件只在浏览器内读取，不调用外部服务。</div></noscript>
</body>
</html>
