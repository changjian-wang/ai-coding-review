<!doctype html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Review vNext 可交互产品原型。使用虚构示例，不连接模型、仓库或 GitHub。">
  <title>Review vNext · 早期五页概念原型</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%230b7a68'/%3E%3Cpath d='m9 16 5 5 9-11' fill='none' stroke='white' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳到主要内容</a>
  <div class="app-shell">
    <aside class="sidebar" aria-label="工作区导航">
      <a class="brand" href="./index.html" aria-label="重新打开 Review vNext 原型">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 28 28" fill="none"><path d="M8 6h9l4 4v12H7V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M16 6v5h5M10 16l3 3 5-6" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span><strong>Review<span class="brand-dot">.</span></strong><small>AI CODING REVIEW</small></span>
        <span class="version-tag">vNext</span>
      </a>
      <div class="workspace-label">当前工作区 <span>本地原型</span></div>
      <div class="workspace-card">
        <span class="workspace-avatar">C</span>
        <div><strong>checkout-service</strong><small>虚构支付与订单项目</small></div>
      </div>
      <div class="nav-label">审查工作流</div>
      <nav id="navigation" class="navigation" aria-label="原型页面"></nav>
      <div class="sidebar-bottom">
        <div class="principle-card">
          <span class="principle-icon" aria-hidden="true">↔</span>
          <strong>不脱离需求，也不盲信需求</strong>
          <p>用业务上下文判断代码，再用实现逻辑验证需求。</p>
        </div>
        <button class="sidebar-help" data-action="help"><span aria-hidden="true">ⓘ</span> 原型说明与操作指南</button>
        <div class="sidebar-status"><i></i> 离线演示 · 未连接模型</div>
      </div>
    </aside>
    <div class="workspace-main">
      <header class="topbar">
        <div class="breadcrumb"><span class="breadcrumb-home" aria-hidden="true">⌘</span><span>工作区</span><span class="slash">/</span><strong id="breadcrumb-title">审查概览</strong></div>
        <div class="topbar-actions">
          <span class="prototype-tag"><i></i> 交互原型</span>
          <label class="scenario-control"><span class="sr-only">切换演示场景</span>
            <select id="scenario-select" aria-label="切换演示场景">
              <option value="standard">需求驱动 · 有关键阻断</option>
              <option value="fresh">从需求确认开始</option>
              <option value="technical">缺少需求 · 技术审查</option>
              <option value="partial">证据受限 · 部分完成</option>
              <option value="ready">问题已处理 · 待人工批准</option>
            </select>
          </label>
          <button id="theme-toggle" class="icon-button" data-action="theme" aria-label="切换为深色主题" title="切换主题"></button>
          <button class="icon-button" data-action="reset" aria-label="重置当前演示" title="重置当前演示"></button>
        </div>
      </header>
      <main id="main-content" tabindex="-1">
        <div id="page"></div>
        <footer class="page-footer"><span>Review vNext · 产品交互验证</span><span>业务、文件与结果均为虚构示例；未分析真实代码，未调用模型，未写回 GitHub。</span></footer>
      </main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="modal-title"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
  <noscript><div class="noscript">此交互原型需要启用 JavaScript。所有资源均在本地，不依赖网络服务。</div></noscript>
</body>
</html>
